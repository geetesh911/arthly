# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @pv/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Build hash
        run: echo "BUILD_HASH=$(pnpm --silent hash)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd apps/web/build && zip -qr "$GITHUB_WORKSPACE/arthly-${GITHUB_REF_NAME}.zip" .)
          gh release create "$GITHUB_REF_NAME" "arthly-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Build hash (scripts/hash-build.mjs over apps/web/build): \`${BUILD_HASH}\`. See CHANGELOG.md."
